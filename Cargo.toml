[workspace]
members = ["crates/domain", "crates/engine"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
publish = false

[workspace.dependencies]
thiserror = "2.0"
proptest = "1.12"

[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Money code: every integer op that can overflow/panic must be explicit (checked_*).
arithmetic_side_effects = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.release]
# Rust wraps silently on overflow in release by default. In finance, panic beats silent corruption.
overflow-checks = true
